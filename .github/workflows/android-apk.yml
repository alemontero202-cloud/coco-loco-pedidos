name: Build Coco Loco APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify project files
        run: |
          node --version
          npm --version
          test -f package.json
          test -f capacitor.config.ts
          test -f index.html
          test -f scripts/write-config.mjs
          test -f scripts/verify-ui.mjs
          test -f premium.css

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify JavaScript syntax and UI selectors
        run: |
          node --check app.js
          node --check store.js
          node --check catalog.js
          node scripts/verify-ui.mjs

      - name: Verify Capacitor CLI
        run: npx cap --version

      - name: Generate Supabase runtime config
        run: npm run build:config

      - name: Verify runtime config
        run: |
          test -f config.local.js
          node -e "import('./config.local.js').then(m=>{if(!m.default?.url||!m.default?.publishableKey) process.exit(1); console.log('Supabase public config OK')})"

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js catalog.js store.js config.local.js manifest.webmanifest premium.css www/
          cat premium.css >> www/styles.css
          test -f www/index.html
          test -f www/app.js
          test -f www/styles.css
          grep -q 'close-receipt' www/index.html
          grep -q 'whatsapp-receipt' www/index.html

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare debug signing key
        run: |
          mkdir -p "$HOME/.android"
          rm -f "$HOME/.android/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Android project
        working-directory: android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK integrity, package and signature
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK ZIP integrity: OK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "apksigner not available on runner; Gradle build succeeded."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coco-loco-pedidos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
