name: Build Coco Loco APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify project files
        run: |
          node --version
          npm --version
          test -f package.json
          test -f capacitor.config.ts
          test -f index.html
          test -f scripts/write-config.mjs

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor CLI
        run: npx cap --version

      - name: Generate Supabase runtime config
        run: npm run build:config

      - name: Verify runtime config
        run: |
          test -f config.local.js
          node -e "import('./config.local.js').then(m=>{if(!m.default?.url||!m.default?.publishableKey) process.exit(1); console.log('Supabase public config OK')})"

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html styles.css app.js catalog.js store.js config.local.js manifest.webmanifest www/
          test -f www/index.html
          test -f www/app.js
          test -f www/styles.css

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Verify Android project
        working-directory: android
        run: ./gradlew --version

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coco-loco-pedidos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
