<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7d1d12"><title>Coco Loco · Administración</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f7f4ef;color:#211b18}header{background:#7d1d12;color:#fff;padding:20px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}header h1{margin:0;font-size:22px}header small{display:block;opacity:.8}main{max-width:1100px;margin:24px auto;padding:0 16px;display:grid;gap:20px}.panel{background:#fff;border:1px solid #e7ded7;border-radius:16px;padding:20px;box-shadow:0 5px 18px #0000000a}.panel h2{margin:0 0 16px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}input,select,textarea{font:inherit;padding:11px;border:1px solid #d8ccc4;border-radius:10px}textarea{min-height:70px;resize:vertical}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;background:#7d1d12;color:#fff;font-weight:650}button.secondary{background:#eee6e0;color:#3a302b}button.danger{background:#a12619}.actions{display:flex;gap:8px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px}.message{padding:10px 12px;border-radius:10px;background:#edf7ed}.message.error{background:#fdebea;color:#8a1f18}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee;vertical-align:top}td small{display:block;color:#756a63;margin-top:3px}td button{margin:2px;font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.form{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.panel{padding:15px}}
</style></head><body><header><div><h1>⚙️ Administración · Coco Loco</h1><small>Menú, precios y categorías</small></div><div class="top-actions"><button id="new-product">+ Nuevo producto</button><button class="secondary" id="signout">Salir</button></div></header>
<div id="blocked" hidden><main><section class="panel"><h2>Acceso restringido</h2><p id="blocked-message"></p><a href="index.html">Volver a Coco Loco</a></section></main></div>
<div id="app"><main><div id="message" class="message">Cargando menú…</div>
<section class="panel"><h2 id="form-title">Agregar producto</h2><form id="product-form" class="form"><input id="product-id" type="hidden"><label class="field">Nombre<input id="name" required maxlength="120"></label><label class="field">Precio (S/)<input id="price" required type="number" min="0" step="0.01"></label><label class="field full">Descripción<textarea id="description" maxlength="300"></textarea></label><label class="field">Categoría<select id="category"></select></label><label class="field">Orden<input id="sort" type="number" step="1" value="0"></label><label class="check"><input id="active" type="checkbox" checked> Disponible para venta</label><div class="actions full"><button id="save-product" type="submit">Agregar producto</button><button id="cancel-product" class="secondary" type="button">Cancelar</button></div></form></section>
<section class="panel"><h2>Productos</h2><div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="panel"><h2>Categorías</h2><form id="category-form" class="form"><input id="category-id" type="hidden"><label class="field">Nombre<input id="category-name" required></label><label class="field">Código<input id="category-code" required pattern="[a-z0-9_-]+"></label><label class="field full">Descripción<input id="category-description"></label><label class="field">Orden<input id="category-sort" type="number" value="0"></label><label class="check"><input id="category-active" type="checkbox" checked> Activa</label><div class="actions full"><button type="submit">Guardar categoría</button></div></form><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Nombre</th><th>Código</th><th>Estado</th><th></th></tr></thead><tbody id="categories"></tbody></table></div></section>
</main></div><script type="module" src="admin.js"></script></body></html>
